version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: queueflow-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: queueflow

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: queueflow-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/queueflow
      - JWT_ACCESS_SECRET=docker_secret_access_jwt_key_queueflow_2026
      - JWT_REFRESH_SECRET=docker_secret_refresh_jwt_key_queueflow_2026
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: queueflow-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
